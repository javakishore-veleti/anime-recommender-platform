[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vectorstore-service"
version = "0.1.0"
description = "FastAPI service: HuggingFace embeddings + Chroma vector store (index/search)."
requires-python = ">=3.12"
dependencies = [
  "anime-shared",
  "uvicorn[standard]>=0.30",
  "langchain-chroma>=0.1.4",
  "langchain-huggingface>=0.0.3",
  "sentence-transformers>=3.0",
  "chromadb>=0.5.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["vectorstore_service"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
