[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recommender-service"
version = "0.1.0"
description = "FastAPI service: anime recommendations via Groq LLM over retrieved context, with Redis caching."
requires-python = ">=3.12"
dependencies = [
  "anime-shared",
  "uvicorn[standard]>=0.30",
  "langchain-core>=0.2.30",
  "langchain-groq>=0.1.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["recommender_service"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
