[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ingestion-service"
version = "0.1.0"
description = "FastAPI service + worker: load the anime dataset into Postgres and the vector store."
requires-python = ">=3.12"
dependencies = [
  "anime-shared",
  "uvicorn[standard]>=0.30",
  "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["ingestion_service"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
