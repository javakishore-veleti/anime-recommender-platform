[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anime-shared"
version = "0.1.0"
description = "Shared cross-cutting library for the anime recommender Middleware services."
authors = [{ name = "javakishore-veleti" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "redis>=5.0",
  "fastapi>=0.111",
  "httpx>=0.27",
  "python-json-logger>=2.0",
  "prometheus-fastapi-instrumentator>=7.0",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp-proto-http>=1.25",
  "opentelemetry-instrumentation-fastapi>=0.46b0",
  "opentelemetry-instrumentation-httpx>=0.46b0",
  "elasticsearch>=8.0,<9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/anime_shared"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
