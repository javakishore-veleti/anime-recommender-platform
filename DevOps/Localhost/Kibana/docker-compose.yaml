# Kibana — log search/dashboards over Elasticsearch.
# Image tag matches what is already present locally (8.15.0).
# Reaches Elasticsearch by container name over the shared anime-net network.
services:
  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: anime-kibana
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: http://anime-elasticsearch:9200
    ports:
      - "${KIBANA_PORT:-5601}:5601"

networks:
  default:
    name: anime-net
    external: true
