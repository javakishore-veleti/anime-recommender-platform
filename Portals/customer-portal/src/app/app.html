<header class="topbar">
  <div class="container topbar__inner">
    <a routerLink="/" class="brand">
      <span class="brand__mark">✦</span>
      <span class="brand__name">Ani<span class="brand__accent">Match</span></span>
    </a>
    <nav class="nav">
      <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">Discover</a>
      <a routerLink="/about" routerLinkActive="is-active">About</a>
    </nav>
  </div>
</header>

<main>
  <router-outlet />
</main>

<footer class="footer">
  <div class="container footer__inner">
    <span>AniMatch — AI-powered anime recommendations</span>
    <span class="text-muted">© {{ year }} · built on the anime-recommender-platform</span>
  </div>
</footer>
